name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME is not on main. Merge the release commit into main before tagging."
            exit 1
          fi
      - name: Verify release metadata
        run: |
          tag="${GITHUB_REF_NAME#v}"
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' Speedster_Camelot.toc | tr -d '[:space:]')
          test "$tag" = "$toc"
          grep -qE "^## \[$tag\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          grep -q '^## X-Curse-Project-ID: 1469829$' Speedster_Camelot.toc
      - name: Extract release notes
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ ("^## \\[" v "\\] - ") { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
      - name: Package and publish
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      # Posts this version's notes to #announcements on the Consecrated Hammer
      # Discord. Needs the RELEASES_WEBHOOK_URL repository secret; the optional
      # DISCORD_ROLE_ID repository variable pings that addon's role. Skipped
      # for pre-releases, and a failed post never fails the release.
      - name: Announce on Discord
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.RELEASES_WEBHOOK_URL }}
          ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          ADDON: ${{ github.event.repository.name }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "RELEASES_WEBHOOK_URL is not set; skipping"; exit 0; fi
          python3 - <<'EOF'
          import glob, json, os, re, urllib.request
          addon, tag = os.environ["ADDON"], os.environ["GITHUB_REF_NAME"].lstrip("v")
          link = f"https://www.curseforge.com/wow/addons/{addon.lower()}"
          for toc in sorted(glob.glob("*.toc")):
              found = re.search(r"^## X-CurseForge:\s*(\S+)", open(toc, encoding="utf-8").read(), re.M)
              if found:
                  link = found.group(1)
                  break
          notes = open("RELEASE_NOTES.md", encoding="utf-8").read().strip()
          if len(notes) > 4000:
              notes = notes[:3990].rsplit("\n", 1)[0] + "\n…"
          role = os.environ.get("ROLE_ID", "").strip()
          body = {
              "content": f"<@&{role}>" if role else "",
              "allowed_mentions": {"roles": [role] if role else []},
              "embeds": [{"title": f"{addon} {tag} released", "url": link,
                          "description": notes, "color": 0xD4AF37}],
          }
          request = urllib.request.Request(os.environ["WEBHOOK"], data=json.dumps(body).encode(), method="POST",
                                           headers={"Content-Type": "application/json", "User-Agent": "consecrated-hammer-release"})
          urllib.request.urlopen(request, timeout=30)
          print(f"announced {addon} {tag}")
          EOF
