name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME is not on main. Merge the release commit into main before tagging."
            exit 1
          fi
      - name: Verify release metadata
        run: |
          tag="${GITHUB_REF_NAME#v}"
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' Speedster_Camelot.toc | tr -d '[:space:]')
          test "$tag" = "$toc"
          grep -qE "^## \[$tag\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          grep -q '^## X-Curse-Project-ID: 1469829$' Speedster_Camelot.toc
      - name: Extract release notes
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ ("^## \\[" v "\\] - ") { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
      - name: Package and publish
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
